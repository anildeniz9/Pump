<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PUMP - Workout Tracker</title>
    <style>
        :root {
            --bg-main: #060b16;
            --bg-card: rgba(16, 26, 46, 0.85);
            --bg-input: #0a1222;
            --border-card: rgba(56, 189, 248, 0.18);
            --border-input: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #8b9bb4;
            --accent-cyan: #00f2fe;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-neon-green: #00e676;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --pill-gradient: linear-gradient(135deg, #00f2fe 0%, #6366f1 50%, #a855f7 100%);
            --cta-gradient: linear-gradient(90deg, #2563eb 0%, #06b6d4 50%, #10b981 100%);
            --cta-glow: 0 8px 25px -4px rgba(16, 185, 129, 0.5), 0 4px 15px -2px rgba(59, 130, 246, 0.4);
            --retro-bg: linear-gradient(135deg, rgba(14, 42, 71, 0.9) 0%, rgba(15, 25, 45, 0.85) 100%);
            --retro-border: rgba(56, 189, 248, 0.5);
            --retro-glow: 0 0 20px rgba(56, 189, 248, 0.18);
        }

        /* Theme 2: Apple OLED Pure Black */
        body.theme-oled {
            --bg-main: #000000;
            --bg-card: #141416;
            --bg-input: #000000;
            --border-card: #2c2c2e;
            --border-input: #2c2c2e;
            --accent-cyan: #00f5ea;
            --accent-blue: #0a84ff;
            --accent-neon-green: #a4ff00;
            --pill-gradient: linear-gradient(135deg, #fa114f 0%, #ff375f 100%);
            --cta-gradient: linear-gradient(90deg, #fa114f 0%, #ff6b00 100%);
            --cta-glow: 0 6px 20px rgba(250, 17, 79, 0.4);
            --retro-bg: #1c1c1e;
            --retro-border: #3a3a3c;
            --retro-glow: none;
        }

        /* Theme 3: Volt Neon */
        body.theme-volt {
            --bg-main: #0f1012;
            --bg-card: #18191c;
            --bg-input: #101114;
            --border-card: rgba(212, 255, 0, 0.2);
            --border-input: #27272a;
            --accent-cyan: #d4ff00;
            --accent-blue: #a3e635;
            --accent-neon-green: #d4ff00;
            --pill-gradient: linear-gradient(135deg, #d4ff00 0%, #84cc16 100%);
            --cta-gradient: linear-gradient(90deg, #a3e635 0%, #d4ff00 100%);
            --cta-glow: 0 6px 20px rgba(212, 255, 0, 0.35);
            --retro-bg: linear-gradient(135deg, rgba(35, 42, 18, 0.9) 0%, rgba(24, 25, 28, 0.9) 100%);
            --retro-border: rgba(212, 255, 0, 0.45);
            --retro-glow: 0 0 15px rgba(212, 255, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, rgba(29, 78, 216, 0.15) 0%, transparent 60%);
            color: var(--text-main);
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 14px 90px 14px;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        /* TOP HEADER */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        .brand-icon {
            font-size: 1.6rem;
            filter: drop-shadow(0 0 8px var(--accent-cyan));
        }

        .current-day {
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .timer-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
            transition: transform 0.15s ease;
        }
        .timer-box:active { transform: scale(0.95); }

        .timer-icon {
            color: var(--accent-cyan);
            font-size: 1.1rem;
        }

        .timer-digits {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--accent-neon-green);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
        }

        /* SUB HEADER: DATE & THEME */
        .sub-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .date-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-input);
            padding: 8px 14px;
            border-radius: 20px;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .date-pill input[type="date"] {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            font-family: inherit;
        }
        .date-pill input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
        }

        .tool-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-input);
            padding: 7px 12px;
            border-radius: 16px;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .tool-btn span.icon {
            font-size: 1rem;
        }
        .tool-btn:hover { color: var(--accent-cyan); }

        /* CATEGORY PILLS */
        .category-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }

        .cat-pill {
            padding: 9px 0;
            text-align: center;
            border-radius: 22px;
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-input);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-pill.active {
            background: var(--pill-gradient);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 0 16px rgba(99, 102, 241, 0.55);
        }
        body.theme-volt .cat-pill.active {
            color: #000000;
            font-weight: 800;
        }

        /* SECTION LABELS */
        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 700;
        }
        .section-label span {
            opacity: 0.65;
            font-weight: 500;
        }

        /* EXERCISE SELECTOR */
        .exercise-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .exercise-select-wrap {
            flex: 1;
            position: relative;
        }

        select#exercise-select {
            width: 100%;
            padding: 13px 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-input);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
            appearance: none;
            outline: none;
        }

        .exercise-select-wrap::after {
            content: "⌄";
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-58%);
            color: var(--text-muted);
            font-size: 1.2rem;
            pointer-events: none;
        }

        .btn-add-ex {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            border: none;
            background: var(--accent-cyan);
            color: #031525;
            font-size: 1.6rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* RETROSPECTIVE BOX (LETZTES TRAINING) */
        .retro-card {
            background: var(--retro-bg);
            border: 1.5px solid var(--retro-border);
            box-shadow: var(--retro-glow);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .retro-card::before {
            content: "";
            position: absolute;
            top: -50%;
            left: 35%;
            width: 60%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
            transform: rotate(25deg);
            pointer-events: none;
        }

        .retro-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #bae6fd;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .copy-last-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: 600;
        }

        .retro-sets-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 0.98rem;
            font-weight: 600;
            color: #ffffff;
        }

        .retro-note {
            margin-top: 8px;
            font-size: 0.82rem;
            color: #93c5fd;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* HEART PIECE: SETS CARD */
        .sets-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 14px 12px;
            margin-bottom: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .set-row {
            display: grid;
            grid-template-columns: 36px 86px 82px 1fr 34px;
            gap: 7px;
            align-items: center;
            margin-bottom: 10px;
            padding: 4px 0;
            transition: opacity 0.2s;
        }

        /* SET TYPE BADGES (W, 1, 2, D) */
        .set-badge {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
            color: #fff;
            transition: transform 0.1s;
        }
        .set-badge:active { transform: scale(0.9); }

        .badge-W {
            background: linear-gradient(135deg, #f97316, #ea580c);
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.45);
        }
        .badge-work {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.45);
        }
        .badge-D {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.45);
        }

        /* WEIGHT & REPS PILL INPUTS */
        .input-pill {
            position: relative;
            display: flex;
            align-items: center;
            background-color: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 10px;
            padding: 0 8px;
            height: 36px;
        }

        .input-pill:focus-within {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.25);
        }

        .input-pill input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 700;
            text-align: right;
            padding-right: 4px;
            outline: none;
        }

        .input-pill .unit {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }

        /* LIVE DELTA FEEDBACK */
        .delta-col {
            font-size: 0.74rem;
            font-weight: 700;
            line-height: 1.25;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 2px;
        }

        .delta-up { color: var(--accent-neon-green); }
        .delta-down { color: #f87171; }
        .delta-neutral { color: var(--text-muted); font-weight: 500; }
        .pr-tag {
            color: #fbbf24;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
            font-weight: 800;
            margin-left: 3px;
        }

        /* CHECKBOXES */
        .set-check {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            border: 1.5px solid #334155;
            background-color: rgba(15, 23, 42, 0.6);
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 900;
            transition: all 0.2s ease;
        }

        .set-check.checked {
            background-color: var(--accent-neon-green);
            border-color: var(--accent-neon-green);
            color: #032211;
            box-shadow: 0 0 14px rgba(0, 230, 118, 0.65);
        }

        .set-check.warmup-check.checked {
            background: transparent;
            border-color: transparent;
            color: var(--accent-neon-green);
            box-shadow: none;
        }

        /* CARD FOOTER: ADD SET & NOTE */
        .sets-footer {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 8px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-add-set {
            background-color: var(--bg-input);
            border: 1px solid var(--border-input);
            color: var(--text-main);
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .note-input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-input);
            color: var(--text-main);
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 0.82rem;
            outline: none;
        }

        .btn-remove-last {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
            width: 36px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* BIG CTA BUTTON */
        .btn-save-workout {
            width: 100%;
            padding: 15px;
            border-radius: 28px;
            border: none;
            background: var(--cta-gradient);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--cta-glow);
            margin-bottom: 22px;
            transition: transform 0.15s ease;
        }
        body.theme-volt .btn-save-workout { color: #000; }
        .btn-save-workout:active { transform: scale(0.98); }

        /* HISTORY CARD */
        .history-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 14px 16px;
        }

        .history-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-title {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .history-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .history-list {
            margin-top: 14px;
            border-top: 1px solid var(--border-input);
            padding-top: 10px;
        }

        .history-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .history-item:last-child { border-bottom: none; }

        .history-item-top {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.92rem;
            margin-bottom: 5px;
        }

        .history-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .mini-badge {
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.78rem;
            color: #cbd5e1;
        }

        .helper-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.74rem;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <div class="top-bar">
        <div class="brand">
            <span class="brand-icon">🏋️‍♂️</span>
            <span>PUMP</span>
        </div>
        <div class="current-day" id="header-day-text">Mi, 14. Okt</div>
        <div class="timer-box" onclick="toggleTimer()" title="Antippen für Start/Reset (3:00 Min)">
            <span class="timer-icon">⏱️</span>
            <span class="timer-digits" id="timer-display">03:00</span>
        </div>
    </div>

    <!-- SUB BAR: DATE & THEME SWITCHER -->
    <div class="sub-bar">
        <div class="date-pill">
            <span>📅</span>
            <input type="date" id="workout-date" onchange="updateHeaderDate()">
        </div>
        <button class="tool-btn" onclick="switchTheme()" title="Design wechseln">
            <span class="icon">🎨</span>
            <span id="theme-label">Cyber</span>
        </button>
    </div>

    <!-- CATEGORY PILLS -->
    <div class="category-row">
        <div class="cat-pill" onclick="filterCategory('All')">Alle</div>
        <div class="cat-pill active" onclick="filterCategory('Push')">Push</div>
        <div class="cat-pill" onclick="filterCategory('Pull')">Pull</div>
        <div class="cat-pill" onclick="filterCategory('Legs')">Legs</div>
    </div>

    <!-- EXERCISE DROPDOWN -->
    <div class="section-label">ÜBUNG</div>
    <div class="exercise-row">
        <div class="exercise-select-wrap">
            <select id="exercise-select" onchange="onExerciseChange()"></select>
        </div>
        <button class="btn-add-ex" onclick="addNewExercise()" title="Neue Übung">+</button>
    </div>

    <!-- LETZTES TRAINING (RETROSPECTIVE BOX) -->
    <div class="retro-card" id="retro-box">
        <div class="retro-header">
            <span>⏮️ LETZTES TRAINING (<span id="retro-date">10.10.</span>)</span>
            <button class="copy-last-btn" onclick="copyLastSessionToCurrent()">⚡ Werte übernehmen</button>
        </div>
        <div class="retro-sets-list" id="retro-sets"></div>
        <div class="retro-note" id="retro-note"></div>
    </div>

    <!-- AKTUELLE SÄTZE (DAS HERZSTÜCK) -->
    <div class="helper-bar">
        <div class="section-label" style="margin-bottom:0;">AKTUELLE SÄTZE <span>(Tippe auf W/1/2/D zum Wechseln)</span></div>
        <button class="clear-btn" onclick="resetBlankSets()">Felder leeren</button>
    </div>

    <div class="sets-card">
        <div id="sets-container"></div>

        <div class="sets-footer">
            <button class="btn-add-set" onclick="addSetRow()">+ Satz hinzufügen</button>
            <input type="text" id="workout-note" class="note-input" placeholder="Notiz (z.B. RPE 9)...">
            <button class="btn-remove-last" onclick="removeLastSet()" title="Letzten Satz löschen">✕</button>
        </div>
    </div>

    <!-- SAVE CTA -->
    <button class="btn-save-workout" onclick="saveWorkout()">
        ✓ ÜBUNG SPEICHERN & TIMER
    </button>

    <!-- VERLAUF -->
    <div class="history-card">
        <div class="history-header-bar">
            <div>
                <div class="history-title">Verlauf</div>
                <div class="history-sub" id="history-summary">Anzeige der letzten Workouts</div>
            </div>
            <span style="color: var(--text-muted); font-size: 1.2rem;">›</span>
        </div>
        <div class="history-list" id="history-container"></div>
    </div>

<script>
    const defaultExercises = [
        { name: "Bankdrücken (Langhantel)", cat: "Push" },
        { name: "Schrägbankdrücken (Kurzhantel)", cat: "Push" },
        { name: "Schulterdrücken", cat: "Push" },
        { name: "Seitheben (Kabel/KH)", cat: "Push" },
        { name: "Trizepsdrücken am Kabel", cat: "Push" },
        { name: "Dips", cat: "Push" },
        { name: "Klimmzüge / Latzug", cat: "Pull" },
        { name: "Rudern (Kabel/Langhantel)", cat: "Pull" },
        { name: "Face Pulls", cat: "Pull" },
        { name: "Bizeps Curls", cat: "Pull" },
        { name: "Hammer Curls", cat: "Pull" },
        { name: "Kniebeugen (Squats)", cat: "Legs" },
        { name: "Beinpresse", cat: "Legs" },
        { name: "Rumänisches Kreuzheben (RDL)", cat: "Legs" },
        { name: "Beinstrecker", cat: "Legs" },
        { name: "Beinbeuger", cat: "Legs" },
        { name: "Wadenheben", cat: "Legs" }
    ];

    const initialDemoLogs = [
        {
            id: 1728550000000,
            timestamp: 1728550000000,
            date: "2026-10-10",
            exercise: "Bankdrücken (Langhantel)",
            sets: [
                { type: "W", weight: 40, reps: 12 },
                { type: "1", weight: 80, reps: 10 },
                { type: "2", weight: 80, reps: 9 },
                { type: "3", weight: 80, reps: 8 }
            ],
            note: "Sitz Stufe 3, RPE 9"
        }
    ];

    let exercises = JSON.parse(localStorage.getItem('pump_exercises')) || defaultExercises;
    let logs = JSON.parse(localStorage.getItem('pump_logs')) || initialDemoLogs;
    let currentCategory = 'Push';
    let themes = ['cyber', 'oled', 'volt'];
    let currentThemeIdx = 0;

    // Standard-Timer auf 3 Minuten (180 Sekunden)
    const DEFAULT_REST_SECONDS = 180;
    let timerSeconds = DEFAULT_REST_SECONDS;
    let timerInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date();
        document.getElementById('workout-date').valueAsDate = today;
        updateHeaderDate();
        renderExercises();
        loadInitialMockupSets();
        renderHistory();
    });

    function loadInitialMockupSets() {
        const container = document.getElementById('sets-container');
        container.innerHTML = '';
        addSetRow('W', 40.0, 12, true);
        addSetRow('work', 82.5, 10, true);
        addSetRow('work', 82.5, 8, false);
        addSetRow('D', 60.0, 12, false);
        recalculateAllDeltas();
    }

    function resetBlankSets() {
        const container = document.getElementById('sets-container');
        container.innerHTML = '';
        addSetRow('W', '', '', false);
        addSetRow('work', '', '', false);
        addSetRow('work', '', '', false);
        addSetRow('work', '', '', false);
        recalculateAllDeltas();
    }

    function updateHeaderDate() {
        const dateVal = document.getElementById('workout-date').value;
        if (!dateVal) return;
        const d = new Date(dateVal + 'T00:00:00');
        const days = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
        const months = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
        document.getElementById('header-day-text').textContent = `${days[d.getDay()]}, ${d.getDate()}. ${months[d.getMonth()]}`;
    }

    function filterCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.cat-pill').forEach(pill => {
            const label = pill.textContent.trim();
            pill.classList.toggle('active', label === (cat === 'All' ? 'Alle' : cat));
        });
        renderExercises();
    }

    function renderExercises() {
        const select = document.getElementById('exercise-select');
        select.innerHTML = '';
        const list = currentCategory === 'All'
            ? exercises
            : exercises.filter(e => e.cat === currentCategory);

        list.forEach(ex => {
            const opt = document.createElement('option');
            opt.value = ex.name;
            opt.textContent = ex.name;
            select.appendChild(opt);
        });
        onExerciseChange();
    }

    function onExerciseChange() {
        updateRetroBox();
        recalculateAllDeltas();
    }

    function getLastLogForExercise(exName) {
        const matching = logs
            .filter(l => l.exercise === exName)
            .sort((a, b) => new Date(b.date) - new Date(a.date) || b.timestamp - a.timestamp);
        return matching.length > 0 ? matching[0] : null;
    }

    function getBest1RMForExercise(exName) {
        let best = 0;
        logs.filter(l => l.exercise === exName).forEach(log => {
            log.sets.forEach(s => {
                if (s.type !== 'W') {
                    const e1rm = s.weight * (1 + s.reps / 30);
                    if (e1rm > best) best = e1rm;
                }
            });
        });
        return best;
    }

    function updateRetroBox() {
        const exName = document.getElementById('exercise-select').value;
        const retroBox = document.getElementById('retro-box');
        const lastLog = getLastLogForExercise(exName);

        if (!lastLog) {
            retroBox.style.display = 'none';
            return;
        }

        retroBox.style.display = 'block';
        const [y, m, d] = lastLog.date.split('-');
        document.getElementById('retro-date').textContent = `${d}.${m}.`;

        const workingSets = lastLog.sets.filter(s => s.type !== 'W');
        const displaySets = workingSets.length > 0 ? workingSets : lastLog.sets;

        document.getElementById('retro-sets').innerHTML = displaySets
            .map(s => `<div>${s.weight} kg × ${s.reps} Wdh.</div>`)
            .join('');

        const noteEl = document.getElementById('retro-note');
        if (lastLog.note) {
            noteEl.style.display = 'flex';
            noteEl.innerHTML = `<span>💬</span> <span>${lastLog.note}</span>`;
        } else {
            noteEl.style.display = 'none';
        }
    }

    function copyLastSessionToCurrent() {
        const exName = document.getElementById('exercise-select').value;
        const lastLog = getLastLogForExercise(exName);
        if (!lastLog) return;

        const container = document.getElementById('sets-container');
        container.innerHTML = '';
        lastLog.sets.forEach(s => {
            const typeCode = (s.type === 'W' || s.type === 'D') ? s.type : 'work';
            addSetRow(typeCode, s.weight, s.reps, false);
        });
        recalculateAllDeltas();
    }

    function addSetRow(type = 'work', weight = '', reps = '', checked = false) {
        const container = document.getElementById('sets-container');

        if (weight === '' && container.children.length > 0) {
            const prevWeight = container.lastElementChild.querySelector('.set-weight').value;
            if (prevWeight) weight = prevWeight;
        }

        const row = document.createElement('div');
        row.className = 'set-row';
        row.dataset.type = type;

        row.innerHTML = `
            <div class="set-badge" onclick="cycleSetType(this)">1</div>
            <div class="input-pill">
                <input type="number" step="0.5" class="set-weight" value="${weight}" placeholder="0" oninput="recalculateAllDeltas()">
                <span class="unit">kg</span>
            </div>
            <div class="input-pill">
                <input type="number" class="set-reps" value="${reps}" placeholder="0" oninput="recalculateAllDeltas()">
                <span class="unit">Wdh.</span>
            </div>
            <div class="delta-col"></div>
            <div class="set-check ${checked ? 'checked' : ''}" onclick="toggleCheck(this)">✓</div>
        `;

        container.appendChild(row);
        renumberBadges();
        recalculateAllDeltas();
    }

    function removeLastSet() {
        const container = document.getElementById('sets-container');
        if (container.children.length > 1) {
            container.lastElementChild.remove();
            renumberBadges();
            recalculateAllDeltas();
        }
    }

    function cycleSetType(badgeEl) {
        const row = badgeEl.parentElement;
        const order = ['work', 'W', 'D'];
        const nextIdx = (order.indexOf(row.dataset.type) + 1) % order.length;
        row.dataset.type = order[nextIdx];
        renumberBadges();
        recalculateAllDeltas();
    }

    function renumberBadges() {
        let workCounter = 1;
        document.querySelectorAll('#sets-container .set-row').forEach(row => {
            const badge = row.querySelector('.set-badge');
            const check = row.querySelector('.set-check');
            const t = row.dataset.type;

            badge.className = 'set-badge';
            check.classList.remove('warmup-check');

            if (t === 'W') {
                badge.classList.add('badge-W');
                badge.textContent = 'W';
                check.classList.add('warmup-check');
            } else if (t === 'D') {
                badge.classList.add('badge-D');
                badge.textContent = 'D';
            } else {
                badge.classList.add('badge-work');
                badge.textContent = workCounter++;
            }
        });
    }

    function recalculateAllDeltas() {
        const exName = document.getElementById('exercise-select').value;
        const lastLog = getLastLogForExercise(exName);
        const bestHistorical1RM = getBest1RMForExercise(exName);

        const lastWorkingSets = lastLog
            ? lastLog.sets.filter(s => s.type !== 'W' && s.type !== 'D')
            : [];

        let workIdx = 0;
        let prAwardedInCurrentSession = false;

        document.querySelectorAll('#sets-container .set-row').forEach(row => {
            const t = row.dataset.type;
            const w = parseFloat(row.querySelector('.set-weight').value);
            const r = parseInt(row.querySelector('.set-reps').value);
            const deltaCol = row.querySelector('.delta-col');

            if (t === 'W') {
                deltaCol.innerHTML = `<span class="delta-neutral">Aufwärmen</span>`;
                return;
            }
            if (t === 'D') {
                deltaCol.innerHTML = `<span class="delta-neutral">Drop-Set</span>`;
                return;
            }

            const refSet = lastWorkingSets[workIdx];
            workIdx++;

            if (isNaN(w) || isNaN(r)) {
                deltaCol.innerHTML = `<span class="delta-neutral">—</span>`;
                return;
            }

            let htmlParts = [];
            if (refSet) {
                const diffW = +(w - refSet.weight).toFixed(1);
                const diffR = r - refSet.reps;

                if (diffR < 0) {
                    htmlParts.push(`<span class="delta-down">▼ ${diffR} Wdh.</span>`);
                } else if (diffR > 0) {
                    htmlParts.push(`<span class="delta-up">▲ +${diffR} Wdh.</span>`);
                }

                if (diffW > 0) {
                    htmlParts.push(`<span class="delta-up">▲ +${diffW}kg</span>`);
                } else if (diffW < 0) {
                    htmlParts.push(`<span class="delta-down">▼ ${diffW}kg</span>`);
                }

                if (diffW === 0 && diffR === 0) {
                    htmlParts.push(`<span class="delta-neutral">±0 (Gleich)</span>`);
                }
            } else {
                htmlParts.push(`<span class="delta-neutral">Neuer Satz</span>`);
            }

            const current1RM = w * (1 + r / 30);
            if (current1RM > bestHistorical1RM && bestHistorical1RM > 0 && !prAwardedInCurrentSession) {
                prAwardedInCurrentSession = true;
                if (htmlParts.length > 0) {
                    htmlParts[0] = htmlParts[0] + ` <span class="pr-tag">🏆 PR!</span>`;
                }
            }

            deltaCol.innerHTML = htmlParts.join('');
        });
    }

    function toggleCheck(checkEl) {
        checkEl.classList.toggle('checked');
        if (checkEl.classList.contains('checked')) {
            startRestTimer(DEFAULT_REST_SECONDS);
        }
    }

    function startRestTimer(seconds = DEFAULT_REST_SECONDS) {
        clearInterval(timerInterval);
        timerSeconds = seconds;
        updateTimerUI();
        timerInterval = setInterval(() => {
            timerSeconds--;
            updateTimerUI();
            if (timerSeconds <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                document.getElementById('timer-display').textContent = "GO! 🔥";
            }
        }, 1000);
    }

    function toggleTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            timerSeconds = DEFAULT_REST_SECONDS;
            updateTimerUI();
        } else {
            startRestTimer(DEFAULT_REST_SECONDS);
        }
    }

    function updateTimerUI() {
        const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const s = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('timer-display').textContent = `${m}:${s}`;
    }

    function addNewExercise() {
        const name = prompt("Name der neuen Übung:");
        if (!name) return;
        const cat = prompt("Kategorie (Push, Pull, Legs):", currentCategory === 'All' ? 'Push' : currentCategory);
        exercises.push({ name: name.trim(), cat: cat ? cat.trim() : 'Push' });
        localStorage.setItem('pump_exercises', JSON.stringify(exercises));
        renderExercises();
        document.getElementById('exercise-select').value = name.trim();
        onExerciseChange();
    }

    function saveWorkout() {
        const date = document.getElementById('workout-date').value;
        const exercise = document.getElementById('exercise-select').value;
        const note = document.getElementById('workout-note').value.trim();

        const sets = [];
        let workNum = 1;
        document.querySelectorAll('#sets-container .set-row').forEach(row => {
            const w = parseFloat(row.querySelector('.set-weight').value);
            const r = parseInt(row.querySelector('.set-reps').value);
            const rawType = row.dataset.type;
            if (!isNaN(w) && !isNaN(r)) {
                const label = rawType === 'work' ? String(workNum++) : rawType;
                sets.push({ type: label, weight: w, reps: r });
            }
        });

        if (sets.length === 0) {
            alert("Bitte mindestens einen Satz mit Gewicht und Wiederholungen eintragen!");
            return;
        }

        logs.push({
            id: Date.now(),
            timestamp: Date.now(),
            date,
            exercise,
            sets,
            note
        });

        localStorage.setItem('pump_logs', JSON.stringify(logs));
        document.getElementById('workout-note').value = '';
        startRestTimer(DEFAULT_REST_SECONDS);
        updateRetroBox();
        recalculateAllDeltas();
        renderHistory();
    }

    function deleteLog(id) {
        if (!confirm("Diesen Eintrag wirklich löschen?")) return;
        logs = logs.filter(l => l.id !== id);
        localStorage.setItem('pump_logs', JSON.stringify(logs));
        updateRetroBox();
        recalculateAllDeltas();
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('history-container');
        container.innerHTML = '';

        const sorted = [...logs].sort((a, b) => new Date(b.date) - new Date(a.date) || b.timestamp - a.timestamp);
        document.getElementById('history-summary').textContent = `${sorted.length} gespeicherte Einheiten`;

        sorted.forEach(log => {
            const [y, m, d] = log.date.split('-');
            const badges = log.sets
                .map(s => `<span class="mini-badge"><b>${s.type}:</b> ${s.weight}kg × ${s.reps} Wdh.</span>`)
                .join('');

            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="history-item-top">
                    <span>${log.exercise}</span>
                    <div>
                        <span style="color:var(--text-muted); font-size:0.8rem;">${d}.${m}.${y}</span>
                        <span onclick="deleteLog(${log.id})" style="cursor:pointer; margin-left:8px; color:#f87171;">🗑️</span>
                    </div>
                </div>
                <div class="history-badges">${badges}</div>
                ${log.note ? `<div style="font-size:0.78rem; color:var(--text-muted); margin-top:4px;">💬 ${log.note}</div>` : ''}
            `;
            container.appendChild(item);
        });
    }

    function switchTheme() {
        currentThemeIdx = (currentThemeIdx + 1) % themes.length;
        document.body.className = '';
        const t = themes[currentThemeIdx];
        if (t === 'oled') {
            document.body.classList.add('theme-oled');
            document.getElementById('theme-label').textContent = 'OLED';
        } else if (t === 'volt') {
            document.body.classList.add('theme-volt');
            document.getElementById('theme-label').textContent = 'Volt';
        } else {
            document.getElementById('theme-label').textContent = 'Cyber';
        }
    }
</script>
</body>
</html>
